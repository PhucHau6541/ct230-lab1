name: ci

on:
  push:
    branches: [ main, th1 ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build và kiểm thử
        run: |
          chmod +x mvnw
          ./mvnw -B verify
